name: AppSec Enforcement Gateway

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & SAST Engine
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install semgrep

      - name: Run Trivy SCA & Dockerfile Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Log CVEs; let Semgrep + AI Gate handle hard failure

      - name: Execute Semgrep SAST (Standard + Custom AST Rules)
        # Do not exit immediately; allow JSON generation so AI Remediator can process findings
        run: |
          semgrep scan --config=auto --config=.semgrep.yml src/ --json -o semgrep_results.json || true

      - name: Run AI Remediation & Policy Enforcement Gate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
          LLM_MODEL: "gemini-3.8-flash"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python ai_remediator.py